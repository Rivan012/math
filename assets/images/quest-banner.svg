  <polygon points="340,65 342,72 350,73 344,78 346,86 340,81 334,86 336,78 330,73 338,72" fill="#FBBF24" opacity="0.9"/>
  <polygon points="200,85 202,90 208,91 204,95 205,101 200,98 195,101 196,95 192,91 198,90" fill="#FDE68A"/>
