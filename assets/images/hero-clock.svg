<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Twin Bells -->
  <circle cx="50" cy="46" r="22" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
  <circle cx="50" cy="46" r="15" fill="#FBBF24"/>
  <circle cx="150" cy="46" r="22" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
  <circle cx="150" cy="46" r="15" fill="#FBBF24"/>
  <!-- Bell Hammer -->
  <rect x="94" y="24" width="12" height="18" rx="3" fill="#64748B"/>
  <circle cx="100" cy="22" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>

  <!-- Clock Feet -->
  <path d="M58 174 L46 192 A3 3 0 0 0 51 195 L72 182 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M142 174 L154 192 A3 3 0 0 1 149 195 L128 182 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Clock Body Outer Shell (Royal School Blue) -->
  <circle cx="100" cy="112" r="76" fill="#2563EB" stroke="#1D4ED8" stroke-width="5"/>
  <circle cx="100" cy="112" r="71" fill="#3B82F6"/>

  <!-- Clock Dial (Crisp Clean White) -->
  <circle cx="100" cy="112" r="62" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>

  <!-- Clock Dial Numbers 1 to 12 -->
  <text x="100" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#29264B" text-anchor="middle">12</text>
  <text x="124" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">1</text>
  <text x="142" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">2</text>
  <text x="148" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#29264B" text-anchor="middle">3</text>
  <text x="142" y="140" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">4</text>
  <text x="124" y="157" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">5</text>
  <text x="100" y="164" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#29264B" text-anchor="middle">6</text>
  <text x="76" y="157" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">7</text>
  <text x="58" y="140" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">8</text>
  <text x="52" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#29264B" text-anchor="middle">9</text>
  <text x="58" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">10</text>
  <text x="76" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#29264B" text-anchor="middle">11</text>

  <!-- Cheerful Cartoon Eyes -->
  <ellipse cx="82" cy="104" rx="6.5" ry="8.5" fill="#0F172A"/>
  <circle cx="80" cy="101" r="2.8" fill="#FFFFFF"/>
  <circle cx="84.5" cy="106.5" r="1.3" fill="#FFFFFF"/>

  <ellipse cx="118" cy="104" rx="6.5" ry="8.5" fill="#0F172A"/>
  <circle cx="116" cy="101" r="2.8" fill="#FFFFFF"/>
  <circle cx="120.5" cy="106.5" r="1.3" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="71" cy="115" rx="6.5" ry="4" fill="#FECDD3" opacity="0.9"/>
  <ellipse cx="129" cy="115" rx="6.5" ry="4" fill="#FECDD3" opacity="0.9"/>

  <!-- Cheerful Smile -->
  <path d="M91 118 Q100 128 109 118" stroke="#0F172A" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Hour Hand (Coral Red pointing to 10) -->
  <line x1="100" y1="112" x2="80" y2="92" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute Hand (Navy Blue pointing to 2) -->
  <line x1="100" y1="112" x2="128" y2="84" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Pin (Shiny Gold) -->
  <circle cx="100" cy="112" r="5.5" fill="#F59E0B" stroke="#B45309" stroke-width="1.8"/>
  <circle cx="98.5" cy="110.5" r="1.8" fill="#FEF3C7"/>
</svg>
