  <!-- Cabin window -->
  <rect x="15" y="12" width="6" height="5" rx="1" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <!-- Chimney -->
  <rect x="7" y="5" width="4" height="5" fill="#EF4444"/>
  <!-- Wheels -->
  <circle cx="8" cy="24" r="3.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="16" cy="24" r="3.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="22" cy="24" r="3.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Headlight clock -->
  <circle cx="4" cy="16" r="2" fill="#F59E0B"/>
