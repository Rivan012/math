<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Siswa Quiz Level 2</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body {
      background: #F1F5F9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .quiz-card {
      background: #FFFFFF;
      max-width: 580px;
      width: 100%;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

  <div class="card quiz-card quizizz-style" id="quizCard">
    <div class="quiz-question-title" id="quizQuestion" style="font-size:1.15rem; font-weight:800; color:#1E293B; text-align:center; margin-bottom:16px;">
      Halim bangun tidur pukul 5 pagi. Pasangkan angka (jam) dan (menit) yang tepat pada jam digital!
    </div>
    <div id="questionIllustration"></div>
    <div id="answerGrid"></div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/quiz.js"></script>
  <script>
    const q = {
      id: "Q005",
      level: 2,
      question: "Halim bangun tidur pukul 5 pagi. Pasangkan angka (jam) dan (menit) yang tepat pada jam digital!",
      type: "clock_drop",
      targetHour: "05",
      targetMinute: "00",
      options: ["07", "30", "05", "12", "00", "06"]
    };
    renderQuestionIllustration(q);
    renderAnswers(q);
  </script>
</body>
</html>
